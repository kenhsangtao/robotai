<!-- ================= LEFT COMPONENT MODULES ================= -->
<!-- Mic INMP441 -->
<g>
<rect x="50" y="150" width="190" height="170" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
<circle cx="60" cy="160" r="3" fill="#0d9488"/><circle cx="230" cy="160" r="3" fill="#0d9488"/><circle cx="60" cy="310" r="3" fill="#0d9488"/><circle cx="230" cy="310" r="3" fill="#0d9488"/>
<text x="145" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#0d9488">INMP441</text>
<text x="145" y="192" text-anchor="middle" font-size="10" fill="#6b7280">I2S microphone</text>
<line x1="66" y1="200" x2="224" y2="200" stroke="#e5e7eb"/>
<text x="66" y="215" font-size="12" fill="#374151">VCC → 3V3</text>
<text x="66" y="245" font-size="12" fill="#374151"><tspan font-weight="700" fill="#0d9488">WS</tspan> → GPIO4</text>
<text x="66" y="275" font-size="12" fill="#374151"><tspan font-weight="700" fill="#0d9488">SCK</tspan> → GPIO5</text>
<text x="66" y="300" font-size="12" fill="#374151"><tspan font-weight="700" fill="#0d9488">SD</tspan> → GPIO6</text>
<text x="145" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">L/R → GND</text>
</g>

<!-- Speaker MAX98357A -->
<g>
<rect x="50" y="360" width="190" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="60" cy="370" r="3" fill="#2563eb"/><circle cx="230" cy="370" r="3" fill="#2563eb"/><circle cx="60" cy="500" r="3" fill="#2563eb"/><circle cx="230" cy="500" r="3" fill="#2563eb"/>
<text x="145" y="386" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb">MAX98357A</text>
<text x="145" y="402" text-anchor="middle" font-size="10" fill="#6b7280">I2S amplified speaker</text>
<line x1="66" y1="410" x2="224" y2="410" stroke="#e5e7eb"/>
<text x="66" y="410" font-size="12" fill="#374151">VIN → 5V (separate supply)</text>
<text x="66" y="438" font-size="12" fill="#374151"><tspan font-weight="700" fill="#2563eb">DIN</tspan> → GPIO7</text>
<text x="66" y="466" font-size="12" fill="#374151"><tspan font-weight="700" fill="#2563eb">BCLK</tspan> → GPIO15 · <tspan font-weight="700" fill="#2563eb">LRCK</tspan> → GPIO16</text>
<text x="145" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">SD hard-wired always on</text>
</g>
<text x="25" y="410" text-anchor="middle" font-size="18">🔋</text>

<!-- TTP223 -->
<g>
<rect x="50" y="540" width="190" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="60" cy="550" r="3" fill="#16a34a"/><circle cx="230" cy="550" r="3" fill="#16a34a"/><circle cx="60" cy="620" r="3" fill="#16a34a"/><circle cx="230" cy="620" r="3" fill="#16a34a"/>
<text x="145" y="562" text-anchor="middle" font-size="14" font-weight="800" fill="#16a34a">TTP223</text>
<text x="145" y="577" text-anchor="middle" font-size="10" fill="#6b7280">Touch sensor</text>
<text x="66" y="598" font-size="12" fill="#374151">VCC→3V3 · <tspan font-weight="700" fill="#16a34a">OUT</tspan>→GPIO17</text>
<text x="66" y="616" font-size="12" fill="#374151">GND → GND</text>
</g>

<!-- ToF -->
<g>
<rect x="50" y="640" width="190" height="90" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
<circle cx="60" cy="650" r="3" fill="#0891b2"/><circle cx="230" cy="650" r="3" fill="#0891b2"/><circle cx="60" cy="720" r="3" fill="#0891b2"/><circle cx="230" cy="720" r="3" fill="#0891b2"/>
<text x="145" y="662" text-anchor="middle" font-size="14" font-weight="800" fill="#0891b2">VL6180X / TOF050C</text>
<text x="145" y="677" text-anchor="middle" font-size="10" fill="#6b7280">Anti-fall sensor</text>
<text x="66" y="698" font-size="12" fill="#374151">VCC→3V3 · GND→GND</text>
<text x="66" y="716" font-size="12" fill="#374151"><tspan font-weight="700" fill="#0891b2">SDA</tspan>→GPIO1 · <tspan font-weight="700" fill="#0891b2">SCL</tspan>→GPIO2</text>
</g>

