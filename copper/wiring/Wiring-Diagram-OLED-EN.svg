<text x="1195" y="436" font-size="11" fill="#374151">IN1·IN2 → <tspan font-weight="700" fill="#ea580c">GPIO11·12</tspan></text>
<text x="1195" y="454" font-size="11" fill="#374151">IN3·IN4 → <tspan font-weight="700" fill="#ea580c">GPIO13·14</tspan></text>
<text x="1195" y="480" font-size="10" font-weight="700" fill="#6b7280">Separate 5-6V motor supply</text>
<text x="1195" y="496" font-size="10" font-weight="700" fill="#6b7280">Share GND with the ESP32</text>
<text x="1195" y="520" font-size="10" fill="#9ca3af">Remap IN1-IN4 to reverse at /robot</text>
</g>
<text x="1370" y="460" text-anchor="middle" font-size="18">🔋</text>

